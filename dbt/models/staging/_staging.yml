version: 2

models:
  - name: stg_events
    description: >
      One row per public GitHub event, read from the silver table (gharchive.silver_events).
      Columns renamed, empty repo names turned into NULL, `action` pulled out of the payload.
      Non-public events are filtered out here (out of scope for gold).
      Semantic duplicate pushes (same push_id recorded as two PushEvents with different event_ids;
      170 on 2026-09-27) are reduced to one row per push_id, keeping the smallest event_id.
    columns:
      - name: event_id
        description: "GitHub event id (text). Unique after silver de-duplication."
        data_tests:
          - unique
          - not_null
      - name: event_type
        description: "GitHub event type, e.g. PushEvent. One of the 16 types in seeds/event_types.csv."
        data_tests:
          - not_null
      - name: event_ts
        description: "When the event happened (UTC). Renamed from created_at."
        data_tests:
          - not_null
      - name: event_date
        description: "UTC date of the event; the silver partition column dt."
        data_tests:
          - not_null
      - name: repo_name
        description: "owner/name at event time; empty strings turned into NULL (seen on some ForkEvents)."
      - name: action
        description: "payload.action when the event type has one (opened, merged, started, ...)."
      - name: payload_json
        description: "Type-specific payload, kept as JSON text; later models extract what they need."
